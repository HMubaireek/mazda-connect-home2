<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home 2.0 preview</title>
<!--
  Desktop preview of the Home 2.0 launcher with a stubbed Mazda GUI framework.
  Open in any browser:  preview/index.html?lang=ar_SA&phone=androidauto&fmt=12hrs
    lang  : ar_SA | en_US | fr_FR ...
    phone : none | androidauto | carplay
    fmt   : 12hrs | 24hrs
  Keys: ← → tilt, [ ] rotate, ↑ ↓ up/down, Enter press.  Mouse = touch.
-->
<style>
  @font-face { font-family: "Tajawal"; src: url(../installer/home2/fonts/Tajawal-Bold.ttf); font-weight: 700; }
  @font-face { font-family: "Tajawal Light"; src: url(../installer/home2/fonts/Tajawal-Light.ttf); font-weight: 300; }
  @font-face { font-family: "Tajawal Medium"; src: url(../installer/home2/fonts/Tajawal-Medium.ttf); font-weight: 500; }
  html, body { margin: 0; background: #111; font-family: system-ui, sans-serif; color: #ddd; }
  #screen { position: relative; width: 800px; height: 480px; overflow: hidden; background: #000; margin: 24px auto 12px; }
  #statusbar { position: absolute; left: 0; top: 0; width: 800px; height: 64px; background: linear-gradient(#22252b, #0b0c10); color: #fff;
               font: 26px/64px Arial, sans-serif; box-sizing: border-box; padding: 0 24px; text-align: right; border-bottom: 1px solid #2a2d33; }
  .TemplateWithStatus { position: absolute; top: 64px; left: 0; width: 800px; height: 416px; }
  #log { width: 800px; margin: 0 auto; font: 13px/1.5 ui-monospace, monospace; color: #9aa; min-height: 40px; }
</style>
</head>
<body>
<div id="screen">
  <div id="statusbar">9:41</div>
  <div class="TemplateWithStatus MainMenuTmplt" id="tmpl"></div>
</div>
<div id="log"></div>
<script>
  var q = new URLSearchParams(location.search);
  var LANG = q.get("lang") || "ar_SA";
  var PHONE = q.get("phone") || "androidauto";
  var FMT = q.get("fmt") || "12hrs";
  var FOCUS = q.get("focus");
  // Like the car: the OS clock may be wrong; the framework caches the real time. ?cached=<ms> overrides.
  var CACHED = q.get("cached") ? +q.get("cached") : Date.now();
  function say(t) { document.getElementById("log").textContent = t; }

  window.log = { addSrcFile: function(){}, debug: function(){}, info: function(){}, warn: function(){}, error: function(){} };
  window.framework = {
    localize: {
      getCurrentLanguage: function() { return LANG; },
      getTimeFormat: function() { return FMT; },
      getLocStr: function(app, id) { return id; }
    },
    common: {
      _remoteUiBtns: { system: PHONE === "none" ? null : { appName: PHONE } },
      getCurrentTime: function() { return CACHED; },
      beep: function() {},
      stealFocus: function() {}
    },
    _appInstances: {},
    sendEventToMmui: function(uiaId, ev) { say("sendEventToMmui(" + uiaId + ", " + ev + ")"); },
    registerCtrlLoaded: function() {}
  };

  function css(href) { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; document.head.appendChild(l); }
  css("../installer/home2/css/MainMenuCtrl.css");
  if (LANG === "ar_SA" || LANG === "he_IL") { css("../installer/home2/css/MainMenuCtrl_rtl.css"); }
</script>
<script src="../installer/home2/js/MainMenuCtrl.js"></script>
<script>
  var ctrl = new MainMenuCtrl("system", document.getElementById("tmpl"), "MainMenuCtrl1", {
    selectCallback: function(c, appData, p) { say("selectCallback icon=" + p.icon); }
  });
  ctrl.handleControllerEvent("acceptFocusInit");
  if (FOCUS !== null) { ctrl._setFocus(+FOCUS); ctrl._setHighlight(+FOCUS); }
  ctrl.endTransitionTo();

  document.addEventListener("keydown", function(e) {
    var map = { ArrowLeft: ["leftStart", "left"], ArrowRight: ["rightStart", "right"], ArrowUp: ["upStart", "up"],
                ArrowDown: ["downStart", "down"], Enter: ["selectStart", "select"], "[": ["ccw"], "]": ["cw"] };
    var evs = map[e.key];
    if (!evs) { return; }
    e.preventDefault();
    var r;
    evs.forEach(function(ev) { var x = ctrl.handleControllerEvent(ev); if (x === "giveFocusUp") { r = x; } });
    if (r === "giveFocusUp") { say("giveFocusUp (focus moves to the status bar)"); }
  });
</script>
</body>
</html>
