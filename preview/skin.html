<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Home 2.0 system skin preview</title>
<!--
  Desktop preview of the system skin (src/skin/home2skin.css, + common_rtl.css in Arabic) on top of Mazda's own CSS.
  Needs Mazda's GUI files in preview/mazda/ first:  sh tools/copy_mazda_preview.sh <extracted jci/gui folder>
  Options: ?lang=ar|en  &screen=settings|alert|home|icons|camera|mute|media|fuel|dialpad|keyboard  &skin=0 (stock look)  &alert=nav|bt|volume|msg  &phone=androidauto|carplay
           &focus=btn (Android Auto button focused by the knob)
  The DOM below copies what Mazda's StatusBarCtrl, SbnCtrl, List2Ctrl and LeftBtnCtrl build on firmware 74.
-->
<base href="mazda/">
<style>
  @font-face { font-family: "Home2 Tajawal Bold"; src: url(../../installer/home2/fonts/Home2Tajawal-Bold.ttf); font-weight: 700; }
  @font-face { font-family: "Home2 Tajawal Light"; src: url(../../installer/home2/fonts/Home2Tajawal-Light.ttf); font-weight: 300; }
  @font-face { font-family: "Home2 Tajawal Medium"; src: url(../../installer/home2/fonts/Home2Tajawal-Medium.ttf); font-weight: 500; }
  html { background: #111; }
  body { margin: 0; position: relative; width: 800px; height: 480px; overflow: hidden; }
</style>
<script>
  var q = new URLSearchParams(location.search);
  var SKIN = q.get("skin") !== "0";
  var AR = q.get("lang") !== "en";
  document.documentElement.lang = AR ? "ar" : "en";
  function css(href, id) { document.write('<link rel="stylesheet"' + (id ? ' id="' + id + '"' : '') + ' href="' + href + '">'); }
  // Same order as the car: common.css (+ common_rtl.css for Arabic), the controls' own sheets (+ their _rtl
  // sheets for Arabic), then home2skin.css, which the launcher adds (the id stops it adding a second copy).
  css("common/css/common.css");
  if (SKIN && AR) { css("../../installer/home2/skin/css/common_rtl.css"); }
  css("common/transitions/css/TransitionsGen.css");
  ["StatusBar", "Sbn", "List2", "LeftBtn", "Button", "Tabs", "Dialog3", "InCall2", "Ump3", "Tuner4", "Wink",
   "ScreenSettings2", "NowPlaying4", "Keyboard", "DialPad2"].forEach(function(c) {
    css("common/controls/" + c + "/css/" + c + "Ctrl.css");
    if (AR) { css("common/controls/" + c + "/css/" + c + "Ctrl_rtl.css"); }   // not every control has one
  });
  css("apps/ecoenergy/controls/FuelConsumption/css/FuelConsumptionCtrl.css");
  if (AR) { css("apps/ecoenergy/controls/FuelConsumption/css/FuelConsumptionCtrl_rtl.css"); }
  css("../../installer/home2/css/MainMenuCtrl.css");
  if (AR) { css("../../installer/home2/css/MainMenuCtrl_rtl.css"); }
  if (SKIN) { css("../../installer/home2/skin/css/home2skin.css", "Home2Skin"); }
  // Minimal stand-in for Mazda's framework, enough for the launcher (see preview/index.html for the full one).
  window.log = { addSrcFile: function(){}, debug: function(){}, info: function(){}, warn: function(){}, error: function(){} };
  window.framework = {
    localize: { getCurrentLanguage: function() { return AR ? "ar_SA" : "en_US"; }, getTimeFormat: function() { return "12hrs"; }, getLocStr: function(a, id) { return id; } },
    common: { _remoteUiBtns: { system: { appName: q.get("phone") || "androidauto" } }, getCurrentTime: function() { return new Date(2026, 9, 31, 14, 26).getTime(); },
              getAtSpeedValue: function() { return false; }, beep: function() {}, stealFocus: function() {} },
    _appInstances: {}, sendEventToMmui: function() {}, registerCtrlLoaded: function() {}
  };
</script>
<script src="../../installer/home2/js/MainMenuCtrl.js"></script>
</head>
<body>
<div class="CommonBgImg" id="bg"></div>
<div id="controls" style="position: absolute; left: 0; top: 0; width: 800px; height: 480px; visibility: hidden"></div>
<div class="TemplateWithStatus" id="home" style="position: absolute; left: 0; top: 64px; width: 800px; height: 416px"></div>
<div id="list"></div>
<div class="StatusBarCtrl" id="sb"></div>
<div class="CommonRightChrome" id="chrome"></div>
<script>
  var SCREEN = q.get("screen") || "settings";
  var ALERT = q.get("alert") || (SCREEN === "alert" ? "nav" : "");
  var PHONE = q.get("phone") || "androidauto";
  var isHome = SCREEN === "home";
  if (SCREEN === "camera") {
    // Video screens (camera, map, Android Auto) ask for a transparent background; the video sits behind the page.
    document.getElementById("bg").setAttribute("style", "background-image: url(common/images/FullTransparent.png)");
    document.documentElement.style.background = "#7a4";
  }
  function el(tag, cls, parent, text, style) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text) { e.textContent = text; }
    if (style) { e.setAttribute("style", style); }
    if (parent) { parent.appendChild(e); }
    return e;
  }
  var PHOTO_BIG = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120">' +
    '<rect width="120" height="120" fill="#c89b6d"/><circle cx="60" cy="46" r="22" fill="#f1d9bd"/><rect x="22" y="76" width="76" height="50" rx="24" fill="#f1d9bd"/></svg>');
  function icon(name, state) { return "display: inline-block; background-image: url(common/images/icons/IcnSb" + name + (state ? "_" + state : "") + ".png);"; }

  // ---- status bar (StatusBarCtrl._createStructure order) ----
  var sb = document.getElementById("sb");
  el("div", "StatusBarCtrlHomeBtn", sb, "", isHome ? "display: none" : "display: block");
  var c0 = el("div", "StatusBarCtrlIconContainer", sb);
  var c1 = el("div", "StatusBarCtrlIconContainer", sb);
  var all = SCREEN === "icons";
  el("div", "StatusBarCtrlIcon", c0, "", all ? icon("Traffic") : "").id = "StatusBar_Traffic";
  el("div", "StatusBarCtrlIcon", c0, "", all ? icon("Roaming") : "").id = "StatusBar_Roaming";
  el("div", "StatusBarCtrlIcon", c1, "", all ? icon("Message") : "").id = "StatusBar_Message";
  el("div", "StatusBarCtrlIcon", c1, "", all ? icon("WifiSignal", "03") : "").id = "StatusBar_WifiSignal";
  el("div", "StatusBarCtrlIcon", c1, "", icon("Batt", all ? "02" : "04")).id = "StatusBar_Batt";
  el("div", "StatusBarCtrlIcon", c1, "", icon("PhoneSignal", "04")).id = "StatusBar_Bluetooth";
  el("div", "StatusBarCtrlDivider", sb, "", isHome ? "" : "display: block");
  var domain = el("div", "StatusBarCtrlDomainIcon", sb, "", isHome ? "" : "background-image: url(common/images/icons/IcnSbnSettings.png)");
  var appName = el("div", "StatusBarCtrlAppName", sb, isHome ? "" : (AR ? "الإعدادات" : "Settings"));
  el("div", "StatusBarCtrlClock", sb, "2:26");
  if (isHome) {
    // StatusBarCtrl.showRemoteUiButton: a ButtonCtrl with the Android Auto / CarPlay icon
    var t = PHONE === "carplay" ? "_CP" : "_AA";
    var btn = el("div", "StatusBarCtrlRemoteUIBtn_En" + (q.get("focus") === "btn" ? " StatusBarCtrlRemoteUIBtn" + t + "_focused" : ""), sb);
    el("div", "ButtonCtrlIcon" + t, btn, "", "background-image: url(apps/system/images/" + (PHONE === "carplay" ? "AppleCP_Active" : "Android_Auto_Active") + ".png)");
  }
  // Mark icon groups the way the launcher's StatusBarCtrl hook does.
  if (typeof home2MarkIconGroups === "function") { home2MarkIconGroups({ _iconContainer0: c0, _iconContainer1: c1 }); }

  // ---- alert (SbnCtrl) ----
  if (ALERT) {
    var texts = AR ? { nav: "بعد ٣٠٠ م انعطف يمينًا", bt: "تم توصيل جوال حسين", volume: "الصوت ١٨", msg: "رسالة جديدة من أحمد", mute: "كتم الصوت" }
                   : { nav: "In 300 m turn right", bt: "Hussain's phone connected", volume: "Volume 18", msg: "New message from Ahmed", mute: "Mute" };
    var images = { nav: "IcnSbnMap", bt: "IcnSbnBt", volume: "IcnSbnVolume", msg: "IcnSbnComm", mute: "IcnSbnMuteOn" };
    var sbn = el("div", "SbnCtrl", document.body);
    el("div", "SbnCtrl_Style02_Image1", sbn, "", "background-image: url(common/images/icons/" + images[ALERT] + ".png)");
    el("div", "SbnCtrl_Style02_Text1", sbn, texts[ALERT]);
    [c0, c1, appName, domain].forEach(function(e) { e.style.opacity = 0; });   // StatusBarCtrl.setSbnDisplayed(true)
  }

  // ---- menu (List2Tmplt + List2Ctrl, normal items, no title) and the back button ----
  if (SCREEN === "mute") {
    // WinkCtrl: Mazda's centre notification box (mute)
    var wink = el("div", "WinkCtrl WinkCtrlStyle05", document.body, "", "position: absolute; left: 0; top: 64px; width: 800px; height: 416px");
    el("div", "WinkStyle5Image1", wink, "", "position: absolute; left: 182px; top: 63px; width: 440px; height: 230px; background: url(common/images/icons/IcnWinkMute.png) 50% 50% no-repeat");
  }
  if (SCREEN === "media") {
    // Ump3Ctrl: the media / call button bar, 6 ButtonCtrl buttons with inline icons (Ump3Ctrl._setButtonIcon)
    var ump = el("div", "Ump3Ctrl", document.body, "", "position: absolute; top: 340px");
    el("div", "Ump3CtrlBackground", ump);
    ["IcnUmpShuffle_On_En", "IcnUmpPreviousAudio_En", "IcnUmpPlayPause_Pause_En", "IcnUmpNextAudio_En", "IcnUmpRepeat_None_En",
     "IcnUmpEqualizer_Ds"].forEach(function(name, i) {
      var b = el("div", "Ump3Ctrl6Button" + (i === 2 ? "_focused" : "_En"), ump, "", "position: absolute; left: " + (i * 133) + "px");
      el("div", "Ump3CtrlButtonIcon", b, "", "background-image: url(common/images/icons/" + name + ".png)");
    });
  }
  if (SCREEN === "radio") {
    // FM radio: NowPlaying4Ctrl style 2 (frequency as the title, no artwork), the media bar and its tooltip
    var np = el("div", "NowPlaying4Ctrl", document.body, "", "position: absolute; top: 64px");
    el("div", "NowPlaying4CtrlTitleFull", np, "89.20");
    var info = el("div", "NowPlaying4CtrlInfoBox", np);
    el("div", "NowPlaying4CtrlAudioTitle", info, AR ? "إذاعة الرياض" : "Riyadh Radio", "position: relative; font-size: 26px; color: rgba(255,255,255,0.8)");
    var art = el("div", "NowPlaying4CtrlArtworkImageDiv", np);
    el("div", "NowPlaying4CtrlArtworkImageBorder", art);
    var ump2 = el("div", "Ump3Ctrl", document.body, "", "position: absolute; top: 340px");
    el("div", "Ump3CtrlBackground", ump2);
    ["IcnUmpEntMenu_En", "IcnUmpAutoMem_En", "IcnUmpFavorite_Unfavorite_En", "IcnUmpScan_Unsel_En", "IcnUmpTune_En",
     "IcnUmpPreviousChannel_En", "IcnUmpNextChannel_En", "IcnUmpEqualizer_En"].forEach(function(name, i) {
      var b = el("div", "Ump3Ctrl8Button" + (i === 0 ? "_focused" : "_En"), ump2, "", "position: absolute; left: " + (i * 100) + "px");
      el("div", "Ump3CtrlButtonIcon", b, "", "background-image: url(common/images/icons/" + name + ".png)");
    });
    var tip = el("div", "Ump3CtrlTooltip", ump2, "", "opacity: 1; left: 4px");
    el("div", "Ump3CtrlTooltipBalloon", tip, AR ? "الترفيه" : "Entertainment");
    el("div", "Ump3CtrlTooltipPoint", tip, "", "left: 32px");
  }
  if (SCREEN === "camadjust") {
    // Reversing camera adjustment: ScreenSettings2Ctrl (close button, tab row, slider) over the camera picture
    document.getElementById("bg").setAttribute("style", "background-image: url(common/images/FullTransparent.png)");
    document.documentElement.style.background = "#7a4";
    var ss = el("div", "ScreenSettings2Ctrl", document.body, "", "position: absolute; top: 64px; left: 0; width: 800px; height: 416px");
    el("div", "ScreenSettings2CtrlCloseBtn_Bg", ss, "", "display: block");
    var tabs = el("div", "ScreenSettings2CtrlTabsBg", ss, "", "display: block");
    (AR ? ["السطوع", "التباين", "تظليل", "اللون", "إعادة ضبط"] : ["Brightness", "Contrast", "Tint", "Color", "Reset"]).forEach(function(t, i) {
      el("div", "ScreenSettings2CtrlTabBtn_En" + (i === 0 ? " ScreenSettings2CtrlTabBtn_Selected" : ""), tabs, t, "left: " + (i * 145) + "px");
    });
  }
  if (SCREEN === "dialog") {
    // Dialog3Ctrl style14: a message, Mazda's animated spinner (<img>) and one button (e.g. "reconnect USB")
    var dlg = el("div", "Dialog3Ctrl", document.body, "", "position: absolute; top: 64px; left: 0; width: 800px; height: 416px");
    var dc = el("div", "Dialog3CtrlContainer", dlg);
    var d14 = el("div", "Dialog3Ctrl_Style14", dc);
    el("div", "Dialog3Ctrl_Style14_Text1", d14, AR ? "إعادة اتصال USB لاستئناف التشغيل" : "Reconnect USB to resume playback");
    var meter = el("div", "Dialog3Ctrl_Indeterminate_Meter_01", el("div", "Dialog3Ctrl_Style14_Image1", d14));
    el("img", "", meter).src = "common/images/IndeterminateMeter.png";
    el("div", "Dialog3Ctrl_ButtonStyle01_En Dialog3Ctrl_ButtonStyle01_focused", dc, AR ? "قائمة الترفيه" : "Entertainment menu",
       "position: absolute; left: 79px; top: 316px; width: 646px; height: 72px; line-height: 72px; text-align: center");
  }
  if (SCREEN === "fuel") {
    // ecoenergy FuelConsumptionCtrl: the per-minute graph (left) and the per-reset history (right)
    var fc = el("div", "FuelConsumptionCtrl", document.body, "", "position: absolute; top: 64px");
    var ga = el("div", "FuelConsumptionCtrlGraphsArea", fc);
    var g1 = el("div", "FuelConsumptionCtrlCDFEGraph", ga);
    var a1 = el("div", "FuelConsumptionCtrlCDFEGraphArea", el("div", "FuelConsumptionCtrlCDFEGraphClipMask", g1));
    [40, 62, 55, 80, 70, 90, 66, 50, 74, 85].forEach(function(hgt, i) {
      el("div", i === 9 ? "FuelConsumptionCtrlCDFEBarGraphCoreCurrent" : "FuelConsumptionCtrlCDFEBarGraphCore", a1, "",
         "position: absolute; bottom: 0; left: " + (i * 24) + "px; height: " + hgt + "px");
    });
    var g2 = el("div", "FuelConsumptionCtrlCFERGraph", ga);
    [60, 75, 52, 88, 70].forEach(function(hgt, i) {
      el("div", i === 4 ? "FuelConsumptionCtrlCFERBarGraphCoreCurrent" : "FuelConsumptionCtrlCFERBarGraphCore", g2, "",
         "position: absolute; bottom: 0; left: " + (20 + i * 79) + "px; height: " + hgt + "px");
    });
  }
  if (SCREEN === "dialpad") {
    // DialPad2Ctrl style 02 as DialPad2Ctrl._buildPhoneDialPad builds it: background, number, delete key, 12 keys
    // (digit + letters span), call button, back button. Positions come from the CSS, as in the car.
    var tmp = el("div", "", document.body, "", "position: absolute; top: 64px; left: 0; width: 800px; height: 416px");
    var dp = el("div", "DialPad2Ctrl DialpadStyle02", tmp);
    el("div", "ctrlBackground", dp);
    var inp = el("div", "inputDiv", dp);
    el("span", "inputSpan", inp, "0551234567", "left: 16px");
    el("div", "inputFade", inp);
    el("div", "caret", inp, "", "left: 15px");
    el("img", "", el("div", "btn clear", dp)).src = "common/controls/DialPad2/images/Delete_Btn.png";
    var letters = ["+", "", "ABC", "DEF", "GHI", "JKL", "MNO", "PQRS", "TUV", "WXYZ"];
    for (var k = 0; k < 12; k++) {
      var b = el("div", "btn", dp);
      if (k < 10) { b.appendChild(document.createTextNode(k)); b.classList.add("btn" + k); el("span", "", b, letters[k]); }
      else { b.appendChild(document.createTextNode(k === 10 ? "*" : "#")); b.classList.add(k === 10 ? "btnAsterisk" : "btnSharp"); }
      if (k === 5) { b.classList.add("focused"); }
    }
    el("div", "btn callBtn", dp);
    el("div", "btn leftBtn", dp);
  }
  if (SCREEN === "incall" || SCREEN === "incall2") {
    // InCall2Ctrl (OneCall / TwoCall) as InCall2Ctrl._createContactStructure builds it, with the classes the
    // launcher adds (H2OneCall / H2TwoCall, H2CallPhoto), and the call button bar (Ump3Ctrl, 7 buttons).
    var two = SCREEN === "incall2";
    var ic = el("div", "InCall2Ctrl InCall2InCallBG " + (two ? "H2TwoCall" : "H2OneCall"), document.body, "", "top: 64px");
    el("span", "InCall2CtrlTitle", ic, AR ? "الاتصال جارٍ" : "Call in progress");
    var people = [[AR ? "حورتي ♥️ Sweet Heart" : "Sweet Heart ♥️", AR ? "جوال" : "Mobile", "00:42", true, true],
                  [AR ? "أبو عمر" : "Abu Omar", "+966 55 123 4567", "03:15", false, false]];
    people.slice(0, two ? 2 : 1).forEach(function(p, n) {
      var c = el("div", "InCall2Contact" + (n + 1) + (two && p[3] ? " InCall2ContactActiveBkg" : ""), ic);
      el("span", "InCall2CtrlTitleContactRuleLine", c);
      el("div", "InCall2CallContactIcon " + (p[3] ? "InCall2ActivePhone" : "InCall2InactivePhone"), c);
      var fr = el("div", "InCall2ContactImageFrame", c);
      el("img", "", fr).src = "common/images/icons/IcnContactImagePlaceholder_Active.png";
      if (p[4]) { el("div", "H2CallPhoto", fr, "", "display: block; background-image: url(" + PHOTO_BIG + ")"); }
      var col = p[3] ? " InCall2ActiveFontColor" : " InCall2InactiveFontColor";
      el("span", "InCall2ContactName" + col, c, p[0]);
      el("span", "InCall2ContactPhoneNumber" + col, c, p[1]);
      el("span", "InCall2ContactElapsedTime" + col, c, p[2]);
    });
    var umpc = el("div", "Ump3Ctrl", ic, "", "position: absolute; top: 276px");
    el("div", "Ump3CtrlBackground", umpc);
    ["IcnUmpSms_En", "IcnUmpCall_En", "IcnUmpPhoneRoute_Handset_En", "IcnUmpMuteUnmute_Unmute_En", "IcnUmpAddCall_En",
     "IcnUmpSwap_Ds", "IcnUmpDialpad_En"].forEach(function(name, i) {
      var b = el("div", "Ump3Ctrl7Button" + (i === 1 ? "_focused" : "_En"), umpc, "", "position: absolute; left: " + (i * 114) + "px");
      el("div", "Ump3CtrlButtonIcon", b, "", "background-image: url(common/images/icons/" + name + ".png)");
    });
  }
  if (SCREEN === "keyboard") {
    // KeyboardCtrl, 5x10 layout: input box, letter keys, space bar
    var kb = el("div", "KeyboardCtrl", document.body, "", "position: absolute; top: 64px; left: 0");
    el("div", "inputBoxTouchActiveArea focused", kb, "");
    var bw = el("div", "btnWrapper fiveTen", kb);
    (AR ? "ضصثقفغعهخحجدشسيبلاتنمكطئءؤرىةوزظ" : "QWERTYUIOPASDFGHJKLZXCVBNM").split("").forEach(function(k, i) {
      el("div", "btn" + (i === 3 ? " focused" : ""), bw, k);
    });
    var cw = el("div", "controlsWrapper", bw);
    el("div", "", cw, "").id = "btnShift";
    el("div", "", cw, "").id = "btnSpacebar";
    el("div", "", cw, "").id = "btnOK";
  }
  if (!isHome && ["camera", "media", "fuel", "dialpad", "keyboard", "radio", "camadjust", "dialog", "incall", "incall2"].indexOf(SCREEN) < 0) {
    var tabbed = SCREEN === "tabs" || SCREEN === "favorites" || SCREEN === "calls";
    var tmpl = el("div", "TemplateWithStatusLeft List2Tmplt", document.getElementById("list"));
    var list = el("div", "List2Ctrl normalItems " + (tabbed ? "tabsTitle" : "noTitle") + (SCREEN === "contacts" ? " letterIndex" : ""), tmpl);
    if (SCREEN === "calls") {
      // Call history: TabsCtrl with 2 tabs (Mazda's lefts 15/369), "All calls" chosen
      var t2 = el("div", "TabsCtrlStyle2", list);
      (AR ? ["جميع المكالمات", "المكالمات الفائتة"] : ["All calls", "Missed calls"]).forEach(function(t, i) {
        var b = el("div", "TabsCtrlStyle2Button" + (i === 0 ? "EnabledCurrent" : "Enabled"), t2, "", "left: " + (15 + i * 354) + "px");
        el("span", "TabsCtrlLabelSpan", b, t);
      });
    }
    if (SCREEN === "tabs") {
      // Settings: TabsCtrl with more than 4 tabs (arrows), 4 visible at Mazda's lefts 84/227/370/513, Display chosen
      var tc = el("div", "TabsCtrlStyle4", list);
      el("div", "ButtonCtrlIcon", el("div", "TabsCtrlStyle4PrevBtn", tc), "", "background-image: url(common/controls/Tabs/images/Tab_ArrowLeft.png)");
      el("div", "ButtonCtrlIcon", el("div", "TabsCtrlStyle4NextBtn", tc), "", "background-image: url(common/controls/Tabs/images/Tab_ArrowRight.png)");
      (AR ? ["AD-Disp", "العرض", "السلامة", "الصوت"] : ["AD-Disp", "Display", "Safety", "Sound"]).forEach(function(t, i) {
        var b = el("div", "TabsCtrlStyle4Button" + (i === 1 ? "EnabledCurrent" : "Enabled"), tc, "", "left: " + (84 + i * 143) + "px");
        el("span", "TabsCtrlLabelSpan", b, t);
      });
      el("div", "TabsCtrlBottomMask", tc);
    }
    if (SCREEN === "favorites") {
      // Favorites: 3 tabs at Mazda's lefts 16/254/492
      var tf = el("div", "TabsCtrlStyle3", list);
      (AR ? ["الموسيقى", "الاتصالات", "الملاحة"] : ["Audio", "Contacts", "Navigation"]).forEach(function(t, i) {
        var b = el("div", "TabsCtrlStyle3Button" + (i === 0 ? "EnabledCurrent" : "Enabled"), tf, "", "left: " + (16 + i * 238) + "px");
        el("span", "TabsCtrlLabelSpan", b, t);
      });
    }
    var mask = el("div", "List2CtrlMask", list);
    var scroller = el("div", "List2CtrlScroller", mask);
    var PHOTO = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="53" height="53">' +
      '<rect width="53" height="53" fill="#c89b6d"/><circle cx="26" cy="20" r="10" fill="#f1d9bd"/><rect x="10" y="33" width="32" height="20" rx="10" fill="#f1d9bd"/></svg>');
    var rows = SCREEN === "contacts"
      ? (AR ? [["تحرير جهات الاتصال", "IcnListAddRecipient_En"], ["ابراهيم خ", "IcnListContact_En"], ["ابراهيم علي", PHOTO],
               ["أبو عمر", "IcnListContact_En"], ["أحمد", "IcnListContact_En"]]
            : [["Edit contacts", "IcnListAddRecipient_En"], ["Ibrahim K", "IcnListContact_En"], ["Ibrahim Ali", PHOTO],
               ["Abu Omar", "IcnListContact_En"], ["Ahmed", "IcnListContact_En"]])
      : (AR ? ["الشاشة", "الصوت", "الساعة", "الأجهزة", "اللغة", "النظام", "إعادة الضبط"]
            : ["Display", "Sound", "Clock", "Devices", "Language", "System", "Factory Reset"]).map(function(l) { return [l, ""]; });
    var topRow = SCREEN === "loading" ? 1 : 0;
    if (SCREEN === "calls") {
      // List2Ctrl style07 with labelWidth "wide" (phoneApp): call icon, name, time over date
      var sh = AR ? "حورتي ♥️ Sweet Heart" : "Sweet Heart ♥️";
      [[sh, "IcnListCall_Incoming", "PM 05:12", AR ? "5 نوفمبر" : "5 Nov"],
       [AR ? "حلاق - محمد - بجانب" : "Barber - Mohammed", "IcnListCall_Outgoing", "PM 08:18", AR ? "4 نوفمبر" : "4 Nov"],
       [sh, "IcnListCall_Incoming", "PM 08:08", AR ? "4 نوفمبر" : "4 Nov"],
       [sh, "IcnListCall_Missed", "PM 04:43", AR ? "30 سبتمبر" : "30 Sep"]].forEach(function(r, i) {
        var li = el("div", "ListItem style07 wideLabel" + (i === 0 ? " focus" : ""), scroller, "", "top: " + (i * 64) + "px");
        el("span", "image1", li, "", "background-image: url(common/images/icons/" + r[1] + ".png)");
        el("span", "label1", li, r[2]);
        el("span", "label2", li, r[3]);
        el("span", "line1", li, r[0]);
      });
      rows = [];
    }
    if (SCREEN === "contacts") {
      // Letter index (List2Ctrl hasLetterIndex): an <ol> of letters in its own wrapper
      var lw = el("div", "List2CtrlLetterIndexWrapper", list);
      var ol = el("ol", "List2CtrlLetterIndex", lw);
      (AR ? ["أ", "ب", "ت", "ث", "ج", "ح"] : ["A", "B", "C", "D", "E", "F"]).forEach(function(l, i) {
        el("li", "letter" + (i === 1 ? " active" : "") + (i === 4 ? " disabled" : ""), ol, l);
      });
    }
    rows.forEach(function(r, i) {
      var li = el("div", "ListItem style01" + (i === 0 ? " focus" : ""), scroller, "", "top: " + ((i + topRow) * 64) + "px");
      var img = el("span", "image1", li);
      if (r[1]) { img.style.backgroundImage = "url(" + (r[1].indexOf("data:") === 0 ? r[1] : "common/images/icons/" + r[1] + ".png") + ")"; }
      el("span", "line1", li, r[0]);
    });
    if (SCREEN === "loading") {
      // List2Ctrl's loading row (call history, contacts while they download)
      var ld = el("div", "List2CtrlLoading", scroller);
      el("span", "loadingImage1", ld);
      el("span", "loadingText", ld, AR ? "التحميل جارٍ" : "Loading");
      el("span", "loadingImage", ld);
    }
    el("div", "List2CtrlActiveArea", list);
    var sw = el("div", "List2CtrlScrollIndicatorWrapper", list, "", "height: 416px; top: 0px");
    el("div", "List2CtrlScrollIndicator", sw, "", "height: 330px; top: 0px");
    var left = el("div", "LeftBtnCtrl", document.body);
    el("div", "LeftBtnCtrlBackBtn", left);
  }
  if (isHome) {
    document.getElementById("chrome").style.display = "none";
    window.ctrl = new MainMenuCtrl("system", document.getElementById("home"), "MainMenuCtrl1", { selectCallback: function() {} });
    ctrl.handleControllerEvent("acceptFocusInit");
  }
</script>
</body>
</html>
