<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Home 2.0 system skin preview</title>
<!--
  Desktop preview of the system skin (src/skin/home2skin.css, + common_rtl.css in Arabic) on top of Mazda's own CSS.
  Needs Mazda's GUI files in preview/mazda/ first:  sh tools/copy_mazda_preview.sh <extracted jci/gui folder>
  Options: ?lang=ar|en  &screen=settings|alert|home|icons|camera|mute|media|fuel|dialpad|keyboard  &skin=0 (stock look)  &alert=nav|bt|volume|msg  &phone=androidauto|carplay
           &focus=btn (Android Auto button focused by the knob)
  The DOM below copies what Mazda's StatusBarCtrl, SbnCtrl, List2Ctrl and LeftBtnCtrl build on firmware 74.
-->
<base href="mazda/">
<style>
  @font-face { font-family: "Home2 Tajawal Bold"; src: url(../../installer/home2/fonts/Home2Tajawal-Bold.ttf); font-weight: 700; }
  @font-face { font-family: "Home2 Tajawal Light"; src: url(../../installer/home2/fonts/Home2Tajawal-Light.ttf); font-weight: 300; }
  @font-face { font-family: "Home2 Tajawal Medium"; src: url(../../installer/home2/fonts/Home2Tajawal-Medium.ttf); font-weight: 500; }
  html { background: #111; }
  body { margin: 0; position: relative; width: 800px; height: 480px; overflow: hidden; }
</style>
<script>
  var q = new URLSearchParams(location.search);
  var SKIN = q.get("skin") !== "0";
  var AR = q.get("lang") !== "en";
  document.documentElement.lang = AR ? "ar" : "en";
  function css(href, id) { document.write('<link rel="stylesheet"' + (id ? ' id="' + id + '"' : '') + ' href="' + href + '">'); }
  // Same order as the car: common.css (+ common_rtl.css for Arabic), the controls' own sheets (+ their _rtl
  // sheets for Arabic), then home2skin.css, which the launcher adds (the id stops it adding a second copy).
  css("common/css/common.css");
  if (SKIN && AR) { css("../../installer/home2/skin/css/common_rtl.css"); }
  css("common/transitions/css/TransitionsGen.css");
  ["StatusBar", "Sbn", "List2", "LeftBtn", "Button", "Tabs", "Dialog3", "InCall2", "Ump3", "Tuner4", "Wink",
   "ScreenSettings2", "NowPlaying4", "Keyboard", "DialPad2"].forEach(function(c) {
    css("common/controls/" + c + "/css/" + c + "Ctrl.css");
    if (AR) { css("common/controls/" + c + "/css/" + c + "Ctrl_rtl.css"); }   // not every control has one
  });
  css("apps/ecoenergy/controls/FuelConsumption/css/FuelConsumptionCtrl.css");
  if (AR) { css("apps/ecoenergy/controls/FuelConsumption/css/FuelConsumptionCtrl_rtl.css"); }
  css("../../installer/home2/css/MainMenuCtrl.css");
  if (AR) { css("../../installer/home2/css/MainMenuCtrl_rtl.css"); }
  if (SKIN) { css("../../installer/home2/skin/css/home2skin.css", "Home2Skin"); }
  // Minimal stand-in for Mazda's framework, enough for the launcher (see preview/index.html for the full one).
  window.log = { addSrcFile: function(){}, debug: function(){}, info: function(){}, warn: function(){}, error: function(){} };
  window.framework = {
    localize: { getCurrentLanguage: function() { return AR ? "ar_SA" : "en_US"; }, getTimeFormat: function() { return "12hrs"; }, getLocStr: function(a, id) { return id; } },
    common: { _remoteUiBtns: { system: { appName: q.get("phone") || "androidauto" } }, getCurrentTime: function() { return new Date(2026, 9, 31, 14, 26).getTime(); },
              getAtSpeedValue: function() { return false; }, beep: function() {}, stealFocus: function() {} },
    _appInstances: {}, sendEventToMmui: function() {}, registerCtrlLoaded: function() {}
  };
</script>
<script src="../../installer/home2/js/MainMenuCtrl.js"></script>
</head>
<body>
<div class="CommonBgImg" id="bg"></div>
<div id="controls" style="position: absolute; left: 0; top: 0; width: 800px; height: 480px; visibility: hidden"></div>
<div class="TemplateWithStatus" id="home" style="position: absolute; left: 0; top: 64px; width: 800px; height: 416px"></div>
<div id="list"></div>
<div class="StatusBarCtrl" id="sb"></div>
<div class="CommonRightChrome" id="chrome"></div>
<script>
  var SCREEN = q.get("screen") || "settings";
  var ALERT = q.get("alert") || (SCREEN === "alert" ? "nav" : "");
  var PHONE = q.get("phone") || "androidauto";
  var isHome = SCREEN === "home";
  if (SCREEN === "camera") {
    // Video screens (camera, map, Android Auto) ask for a transparent background; the video sits behind the page.
    document.getElementById("bg").setAttribute("style", "background-image: url(common/images/FullTransparent.png)");
    document.documentElement.style.background = "#7a4";
  }
  function el(tag, cls, parent, text, style) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text) { e.textContent = text; }
    if (style) { e.setAttribute("style", style); }
    if (parent) { parent.appendChild(e); }
    return e;
  }
  function icon(name, state) { return "display: inline-block; background-image: url(common/images/icons/IcnSb" + name + (state ? "_" + state : "") + ".png);"; }

  // ---- status bar (StatusBarCtrl._createStructure order) ----
  var sb = document.getElementById("sb");
  el("div", "StatusBarCtrlHomeBtn", sb, "", isHome ? "display: none" : "display: block");
  var c0 = el("div", "StatusBarCtrlIconContainer", sb);
  var c1 = el("div", "StatusBarCtrlIconContainer", sb);
  var all = SCREEN === "icons";
  el("div", "StatusBarCtrlIcon", c0, "", all ? icon("Traffic") : "").id = "StatusBar_Traffic";
  el("div", "StatusBarCtrlIcon", c0, "", all ? icon("Roaming") : "").id = "StatusBar_Roaming";
  el("div", "StatusBarCtrlIcon", c1, "", all ? icon("Message") : "").id = "StatusBar_Message";
  el("div", "StatusBarCtrlIcon", c1, "", all ? icon("WifiSignal", "03") : "").id = "StatusBar_WifiSignal";
  el("div", "StatusBarCtrlIcon", c1, "", icon("Batt", all ? "02" : "04")).id = "StatusBar_Batt";
  el("div", "StatusBarCtrlIcon", c1, "", icon("PhoneSignal", "04")).id = "StatusBar_Bluetooth";
  el("div", "StatusBarCtrlDivider", sb, "", isHome ? "" : "display: block");
  var domain = el("div", "StatusBarCtrlDomainIcon", sb, "", isHome ? "" : "background-image: url(common/images/icons/IcnSbnSettings.png)");
  var appName = el("div", "StatusBarCtrlAppName", sb, isHome ? "" : (AR ? "الإعدادات" : "Settings"));
  el("div", "StatusBarCtrlClock", sb, "2:26");
  if (isHome) {
    // StatusBarCtrl.showRemoteUiButton: a ButtonCtrl with the Android Auto / CarPlay icon
    var t = PHONE === "carplay" ? "_CP" : "_AA";
    var btn = el("div", "StatusBarCtrlRemoteUIBtn_En" + (q.get("focus") === "btn" ? " StatusBarCtrlRemoteUIBtn" + t + "_focused" : ""), sb);
    el("div", "ButtonCtrlIcon" + t, btn, "", "background-image: url(apps/system/images/" + (PHONE === "carplay" ? "AppleCP_Active" : "Android_Auto_Active") + ".png)");
  }
  // Mark icon groups the way the launcher's StatusBarCtrl hook does.
  if (typeof home2MarkIconGroups === "function") { home2MarkIconGroups({ _iconContainer0: c0, _iconContainer1: c1 }); }

  // ---- alert (SbnCtrl) ----
  if (ALERT) {
    var texts = AR ? { nav: "بعد ٣٠٠ م انعطف يمينًا", bt: "تم توصيل جوال حسين", volume: "الصوت ١٨", msg: "رسالة جديدة من أحمد", mute: "كتم الصوت" }
                   : { nav: "In 300 m turn right", bt: "Hussain's phone connected", volume: "Volume 18", msg: "New message from Ahmed", mute: "Mute" };
    var images = { nav: "IcnSbnMap", bt: "IcnSbnBt", volume: "IcnSbnVolume", msg: "IcnSbnComm", mute: "IcnSbnMuteOn" };
    var sbn = el("div", "SbnCtrl", document.body);
    el("div", "SbnCtrl_Style02_Image1", sbn, "", "background-image: url(common/images/icons/" + images[ALERT] + ".png)");
    el("div", "SbnCtrl_Style02_Text1", sbn, texts[ALERT]);
    [c0, c1, appName, domain].forEach(function(e) { e.style.opacity = 0; });   // StatusBarCtrl.setSbnDisplayed(true)
  }

  // ---- menu (List2Tmplt + List2Ctrl, normal items, no title) and the back button ----
  if (SCREEN === "mute") {
    // WinkCtrl: Mazda's centre notification box (mute)
    var wink = el("div", "WinkCtrl WinkCtrlStyle05", document.body, "", "position: absolute; left: 0; top: 64px; width: 800px; height: 416px");
    el("div", "WinkStyle5Image1", wink, "", "position: absolute; left: 182px; top: 63px; width: 440px; height: 230px; background: url(common/images/icons/IcnWinkMute.png) 50% 50% no-repeat");
  }
  if (SCREEN === "media") {
    // Ump3Ctrl: the media / call button bar, 6 ButtonCtrl buttons with inline icons (Ump3Ctrl._setButtonIcon)
    var ump = el("div", "Ump3Ctrl", document.body, "", "position: absolute; top: 340px");
    el("div", "Ump3CtrlBackground", ump);
    ["IcnUmpShuffle_On_En", "IcnUmpPreviousAudio_En", "IcnUmpPlayPause_Pause_En", "IcnUmpNextAudio_En", "IcnUmpRepeat_None_En",
     "IcnUmpEqualizer_Ds"].forEach(function(name, i) {
      var b = el("div", "Ump3Ctrl6Button" + (i === 2 ? "_focused" : "_En"), ump, "", "position: absolute; left: " + (i * 133) + "px");
      el("div", "Ump3CtrlButtonIcon", b, "", "background-image: url(common/images/icons/" + name + ".png)");
    });
  }
  if (SCREEN === "fuel") {
    // ecoenergy FuelConsumptionCtrl: the per-minute graph (left) and the per-reset history (right)
    var fc = el("div", "FuelConsumptionCtrl", document.body, "", "position: absolute; top: 64px");
    var ga = el("div", "FuelConsumptionCtrlGraphsArea", fc);
    var g1 = el("div", "FuelConsumptionCtrlCDFEGraph", ga);
    var a1 = el("div", "FuelConsumptionCtrlCDFEGraphArea", el("div", "FuelConsumptionCtrlCDFEGraphClipMask", g1));
    [40, 62, 55, 80, 70, 90, 66, 50, 74, 85].forEach(function(hgt, i) {
      el("div", i === 9 ? "FuelConsumptionCtrlCDFEBarGraphCoreCurrent" : "FuelConsumptionCtrlCDFEBarGraphCore", a1, "",
         "position: absolute; bottom: 0; left: " + (i * 24) + "px; height: " + hgt + "px");
    });
    var g2 = el("div", "FuelConsumptionCtrlCFERGraph", ga);
    [60, 75, 52, 88, 70].forEach(function(hgt, i) {
      el("div", i === 4 ? "FuelConsumptionCtrlCFERBarGraphCoreCurrent" : "FuelConsumptionCtrlCFERBarGraphCore", g2, "",
         "position: absolute; bottom: 0; left: " + (20 + i * 79) + "px; height: " + hgt + "px");
    });
  }
  if (SCREEN === "dialpad") {
    // DialPad2Ctrl style 02: 12 keys and the green call button
    var dp = el("div", "DialPad2Ctrl DialpadStyle02", document.body, "", "position: absolute; top: 64px; left: 0; width: 800px; height: 416px");
    el("div", "ctrlBackground", dp);
    "123456789*0#".split("").forEach(function(k, i) {
      el("div", "btn" + (i === 4 ? " focused" : ""), dp, k, "left: " + (90 + (i % 3) * 130) + "px; top: " + (100 + Math.floor(i / 3) * 78) + "px");
    });
    el("div", "callBtn", dp);
  }
  if (SCREEN === "keyboard") {
    // KeyboardCtrl, 5x10 layout: input box, letter keys, space bar
    var kb = el("div", "KeyboardCtrl", document.body, "", "position: absolute; top: 64px; left: 0");
    el("div", "inputBoxTouchActiveArea focused", kb, "");
    var bw = el("div", "btnWrapper fiveTen", kb);
    (AR ? "ضصثقفغعهخحجدشسيبلاتنمكطئءؤرىةوزظ" : "QWERTYUIOPASDFGHJKLZXCVBNM").split("").forEach(function(k, i) {
      el("div", "btn" + (i === 3 ? " focused" : ""), bw, k);
    });
    var cw = el("div", "controlsWrapper", bw);
    el("div", "", cw, "").id = "btnShift";
    el("div", "", cw, "").id = "btnSpacebar";
    el("div", "", cw, "").id = "btnOK";
  }
  if (!isHome && ["camera", "media", "fuel", "dialpad", "keyboard"].indexOf(SCREEN) < 0) {
    var tmpl = el("div", "TemplateWithStatusLeft List2Tmplt", document.getElementById("list"));
    var list = el("div", "List2Ctrl normalItems noTitle", tmpl);
    var mask = el("div", "List2CtrlMask", list);
    var scroller = el("div", "List2CtrlScroller", mask);
    (AR ? ["الشاشة", "الصوت", "الساعة", "الأجهزة", "اللغة", "النظام", "إعادة الضبط"]
        : ["Display", "Sound", "Clock", "Devices", "Language", "System", "Factory Reset"]).forEach(function(label, i) {
      var li = el("div", "ListItem style01" + (i === 0 ? " focus" : ""), scroller, "", "top: " + (i * 64) + "px");
      el("span", "line1", li, label);
    });
    el("div", "List2CtrlActiveArea", list);
    var sw = el("div", "List2CtrlScrollIndicatorWrapper", list, "", "height: 416px; top: 0px");
    el("div", "List2CtrlScrollIndicator", sw, "", "height: 330px; top: 0px");
    var left = el("div", "LeftBtnCtrl", document.body);
    el("div", "LeftBtnCtrlBackBtn", left);
  }
  if (isHome) {
    document.getElementById("chrome").style.display = "none";
    window.ctrl = new MainMenuCtrl("system", document.getElementById("home"), "MainMenuCtrl1", { selectCallback: function() {} });
    ctrl.handleControllerEvent("acceptFocusInit");
  }
</script>
</body>
</html>
